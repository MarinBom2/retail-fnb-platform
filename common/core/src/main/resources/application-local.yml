# 로컬 프로필 (bootRun 기본). 비밀이 아닌 값만 둔다. 비밀 값은 루트 secrets/application-secret.yml (gitignore)
# DB·Redis 는 루트 docker-compose.yml 을 띄운다
server:
  port: 9190
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/retail_fnb?serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

jwt:
  cookie:
    secure: false       # 로컬은 http

security:
  login-bypass:
    # 비밀번호 없이 로그인을 허용할 이메일 (가입은 되어 있어야 한다). local 프로필에서만 동작
    emails: []
