# 데모 프로필: 메모리 DB(H2) + 데모 데이터 (server 의 DemoDataLoader). MySQL·Redis·Docker 없이 뜬다.
# 실행: SPRING_PROFILES_ACTIVE=demo ./gradlew :server:bootRun   (화면까지: -PwithClient)
# 기동할 때마다 데이터를 새로 만든다. 계정은 md/api.md §7
server:
  port: 9190
spring:
  datasource:
    url: jdbc:h2:mem:retailfnb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  cookie:
    secure: false       # 데모는 http 로도 띄운다
